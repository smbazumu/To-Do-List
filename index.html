<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
  href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inconsolata:wght@200..900&display=swap"
  rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Todo app</title>

</head>
<body>
  <main class="container">
    <div class="head">
      <h1>TODO</h1>
      <img src="icon-sun.svg" alt="" class="lighth">
    </div>
    <div class="createtodo">
      <button class="check"></button>
      <input type="text" name="" class="input" placeholder="Create a new todo">
    </div>
    <div class="todo">

    </div>
    <div class="info">
      <p class="items"></p>
      <div class="status">
        <p id="all">All</p>
        <p id="active">Active</p>
        <p id="completed">Completed</p>
      </div>
      <p id="erase">Clear Completed</p>
    </div>
  </main>
  <script src="index.js"></script>
</body>
</html>
